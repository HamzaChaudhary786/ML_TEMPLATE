project:
  name: "ml_project_template"
  version: "1.0.0"
  author: "Data Science Team"

paths:
  raw_data: "data/raw/dataset.csv"
  processed_train: "data/processed/train.parquet"
  processed_test: "data/processed/test.parquet"
  model_dir: "models"
  artifact_dir: "artifacts"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  logs_dir: "logs"

data:
  target_column: "target"
  drop_columns:
    - "id"
  test_size: 0.20
  random_state: 42
  stratify: true

features:
  numerical_cols:
    - "age"
    - "income"
    - "credit_score"
  categorical_cols:
    - "education"
    - "employment_type"
  scaling_strategy: "standard" # options: standard, minmax, robust
  imputation_strategy_num: "median"
  imputation_strategy_cat: "most_frequent"

models:
  baseline:
    type: "logistic_regression"
    params:
      C: 1.0
      max_iter: 1000
      random_state: 42
  primary:
    type: "random_forest"
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42
      n_jobs: -1

evaluation:
  metric: "roc_auc" # options: accuracy, precision, recall, f1, roc_auc, r2, rmse
  cv_folds: 5
